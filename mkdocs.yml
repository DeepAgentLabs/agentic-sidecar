site_name: Agentic Sidecar Documentation
site_url: https://deepagentlabs.io/agentic-sidecar/docs/
repo_url: https://github.com/DeepAgentLabs/agentic-sidecar
edit_uri: edit/main/docs/
docs_dir: docs
# Serve the generated AI reference as Markdown, without rendering declaration fragments.
exclude_docs: |
  llms-full.md

theme:
  name: material
  palette:
    - scheme: slate
      primary: custom
      accent: custom
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# A page missing from nav fails the strict build
nav:
  - Home: index.md
  - Developer Guide (simple): developer-guide.md
  - API Reference (detailed): api-reference.md
  - AI Readable Documentation: ai-reference-index.md
  - Developer guide topics:
      - Overview: guide/overview.md
      - Quickstart: guide/quickstart.md
      - Capabilities: guide/capabilities.md
      - Core concepts: guide/concepts.md
      - Recommended workflow: guide/workflow.md
      - Configuration: guide/configuration.md
      - Approvals: guide/approvals.md
