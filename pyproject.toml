[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-sidecar"
version = "0.1.0.dev0"
description = "Companion intelligence and real-time decision supervision for autonomous AI agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "agentic-sidecar Contributors" }]
keywords = ["llm", "agents", "governance", "intent", "decision-supervision", "safety"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
# Only what the current scaffold actually needs. `typer`/`rich` belong here
# once the CLI (v0.5, see ROADMAP.md) has real code -- not before.
dependencies = [
  "pydantic>=2.0,<3",
]

[project.optional-dependencies]
# Only needed for agentic_sidecar.integrations.agenticlens -- the core
# runtime never requires it. That module is currently a placeholder (see
# src/agentic_sidecar/integrations/agenticlens.py); this extra is declared
# ahead of time so the dependency boundary is visible from the start.
agenticlens = [
  "agenticlens>=0.1.3",
]
# Only needed for agentic_sidecar.integrations.agentic_chaos -- also a
# placeholder (see src/agentic_sidecar/integrations/agentic_chaos.py). No
# specific floor is known yet since the integration surface itself isn't
# designed -- see ROADMAP.md's Cross-Project Dependencies ("agentic-chaos").
agentic-chaos = [
  "agentic-chaos>=0.1",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "build>=1.2",
  "twine>=5.1",
]

# [project.scripts] intentionally omitted -- add
# `agentic-sidecar = "agentic_sidecar.cli.main:app"` once cli/main.py has a
# real Typer `app` (v0.5, see ROADMAP.md). A console-script entry pointing
# at a stub would build fine but fail the moment anyone actually ran it.

[project.urls]
Homepage = "https://github.com/pramodbn27/agentic-sidecar"
Repository = "https://github.com/pramodbn27/agentic-sidecar"
Issues = "https://github.com/pramodbn27/agentic-sidecar/issues"
Changelog = "https://github.com/pramodbn27/agentic-sidecar/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_sidecar"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["agentic_sidecar"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["agentic_sidecar"]
mypy_path = "src"

[[tool.mypy.overrides]]
# agenticlens is optional -- don't require it installed for `mypy` to pass.
module = "agenticlens.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# agentic_chaos is optional -- don't require it installed for `mypy` to pass.
module = "agentic_chaos.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --cov=agentic_sidecar --cov-report=term-missing"

[tool.coverage.run]
source = ["src/agentic_sidecar"]
